<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>夢日記</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>🌙 夢日記</h1>
  </header>

  <main class="container">

    <!-- ===================== 記録画面 ===================== -->
    <section class="card">
      <h2>今日の夢を記録</h2>

      <!-- 日付（JSで今日の日付を初期値に入れる） -->
      <div class="form-row">
        <label class="form-label" for="dream-date">日付</label>
        <div class="form-content">
          <input type="date" id="dream-date" class="input">
        </div>
      </div>

      <!-- 夢の気分（1つだけ選ぶ） -->
      <div class="form-row">
        <span class="form-label">夢の気分</span>
        <div class="form-content" id="mood-buttons">
          <button type="button" class="mood-btn" data-value="😊"><span class="emoji">😊</span>楽しい</button>
          <button type="button" class="mood-btn" data-value="😨"><span class="emoji">😨</span>怖い</button>
          <button type="button" class="mood-btn" data-value="😢"><span class="emoji">😢</span>悲しい</button>
          <button type="button" class="mood-btn" data-value="😳"><span class="emoji">😳</span>恥ずかしい</button>
          <button type="button" class="mood-btn" data-value="🤔"><span class="emoji">🤔</span>不思議</button>
          <button type="button" class="mood-btn" data-value="😐"><span class="emoji">😐</span>普通</button>
          <button type="button" class="mood-btn" data-value="❓"><span class="emoji">❓</span>その他</button>
        </div>
      </div>

      <!-- 鮮明さ（★1〜5） -->
      <div class="form-row">
        <span class="form-label">鮮明さ</span>
        <div class="form-content" id="clarity-stars">
          <button type="button" class="star" data-value="1">★</button>
          <button type="button" class="star" data-value="2">★</button>
          <button type="button" class="star" data-value="3">★</button>
          <button type="button" class="star" data-value="4">★</button>
          <button type="button" class="star" data-value="5">★</button>
        </div>
      </div>

      <!-- 場所（複数選択。ボタンはJSで作る） -->
      <div class="form-row">
        <span class="form-label">場所</span>
        <div class="form-content">
          <div class="option-list" id="place-options"></div>
          <button type="button" class="add-btn" data-category="places">＋追加</button>
          <div class="add-form hidden" data-category="places">
            <input type="text" class="input add-input" placeholder="例）プール">
            <button type="button" class="add-submit">追加</button>
          </div>
        </div>
      </div>

      <!-- 登場人物（複数選択。ボタンはJSで作る） -->
      <div class="form-row">
        <span class="form-label">登場人物</span>
        <div class="form-content">
          <div class="option-list" id="people-options"></div>
          <button type="button" class="add-btn" data-category="people">＋追加</button>
          <div class="add-form hidden" data-category="people">
            <input type="text" class="input add-input" placeholder="例）先生">
            <button type="button" class="add-submit">追加</button>
          </div>
        </div>
      </div>

      <!-- 出来事（複数選択。ボタンはJSで作る） -->
      <div class="form-row">
        <span class="form-label">出来事</span>
        <div class="form-content">
          <div class="option-list" id="event-options"></div>
          <button type="button" class="add-btn" data-category="events">＋追加</button>
          <div class="add-form hidden" data-category="events">
            <input type="text" class="input add-input" placeholder="例）泳ぐ">
            <button type="button" class="add-submit">追加</button>
          </div>
        </div>
      </div>

      <!-- 睡眠の質（1つだけ選ぶ） -->
      <div class="form-row">
        <span class="form-label">睡眠の質</span>
        <div class="form-content" id="sleep-options">
          <button type="button" class="sleep-btn" data-value="よく眠れた">😴 よく眠れた</button>
          <button type="button" class="sleep-btn" data-value="ふつう">🙂 ふつう</button>
          <button type="button" class="sleep-btn" data-value="寝不足">🥱 寝不足</button>
        </div>
      </div>

      <!-- ひとことメモ（任意） -->
      <div class="form-row">
        <label class="form-label" for="dream-memo">ひとこと</label>
        <div class="form-content">
          <input type="text" id="dream-memo" class="input input-wide" placeholder="（任意）書きたいことがあれば">
        </div>
      </div>

      <div class="save-area">
        <button type="button" id="save-btn" class="save-btn">🌙 記録する</button>
      </div>
    </section>

    <!-- ===================== 一覧・振り返り画面 ===================== -->
    <section class="card">
      <h2>📖 夢の記録一覧</h2>

      <div class="summary">
        <!-- カレンダー（JSで作る） -->
        <div class="summary-box">
          <h3 id="calendar-title">夢カレンダー</h3>
          <div class="calendar-week">
            <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="dream-calendar" class="calendar"></div>
        </div>

        <!-- ランキング（JSで作る） -->
        <div class="summary-box">
          <h3>気分ランキング</h3>
          <ol id="mood-ranking" class="ranking"></ol>

          <h3>よく出る登場人物</h3>
          <ol id="people-ranking" class="ranking"></ol>
        </div>
      </div>

      <!-- 絞り込み -->
      <div class="filter-row">
        <label for="filter-select" class="filter-label">絞り込み：</label>
        <select id="filter-select" class="input">
          <option value="">すべて</option>
          <!-- 選択肢はJSで追加する -->
        </select>
        <span class="count">記録 <span id="dream-count">0</span>件</span>
      </div>

      <!-- 夢の一覧（JSで <li class="dream-card"> を追加する） -->
      <ul id="dream-list" class="dream-list"></ul>
    </section>

  </main>

  <!-- ===================== お知らせのポップアップ ===================== -->
  <!-- 最初は hidden で隠しておき、JSで出したり隠したりする -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <p class="modal-title">🌙 夢日記からのお知らせ</p>
      <p id="modal-message" class="modal-message">ここにメッセージが入ります</p>
      <div class="modal-buttons">
        <button type="button" id="modal-cancel" class="modal-btn modal-cancel hidden">やめる</button>
        <button type="button" id="modal-ok" class="modal-btn modal-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
